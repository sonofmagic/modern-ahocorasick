# repoctl-managed: release/v2
# Prepare version PRs on regular main pushes and publish them after the release
# version commit is merged. Manual dispatch remains available for both phases.
# Preserve this policy during repoctl upgrades.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Prepare a version PR, or publish after merging it
        required: true
        default: prepare
        type: choice
        options: [prepare, publish]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  HUSKY: 0
  NPM_CONFIG_PROVENANCE: true
  npm_config_registry: https://registry.npmjs.org

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.16.0 --registry=https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec repo doctor --strict
      - run: pnpm validate
      - name: Prepare version pull request
        if: |
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(release): version packages')) ||
          (github.event_name == 'workflow_dispatch' && inputs.mode == 'prepare')
        run: pnpm exec repo release stable prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish prepared versions and create release tags
        if: |
          (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release): version packages')) ||
          (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish')
        run: pnpm exec repo release stable publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
